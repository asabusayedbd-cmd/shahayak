name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect Gradle version
        id: detect-gradle
        run: |
          VER=""
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' gradle/wrapper/gradle-wrapper.properties | head -n 1 | sed 's/gradle-//')
          fi

          if [ -z "$VER" ]; then
            if grep -qE '(agp|com\.android\.application)[^0-9]*9\.' gradle/libs.versions.toml build.gradle.kts 2>/dev/null; then
              VER="9.0.0"
            else
              VER="8.13"
            fi
          fi

          echo "Using Gradle version: $VER"
          echo "gradle_ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.detect-gradle.outputs.gradle_ver }}

      - name: Prepare debug keystore and Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Created app/google-services.json from GitHub Secret."
            else
              echo "WARNING: app/google-services.json not found! Creating fallback resource for compilation."
              mkdir -p app/src/main/res/values
              printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="default_web_client_id" translatable="false">placeholder-client-id.apps.googleusercontent.com</string>\n</resources>\n' > app/src/main/res/values/fallback_google_services.xml
            fi
          fi

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shahayak-apk
          path: "**/build/outputs/apk/debug/*.apk"
