name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project directory
        id: find-dir
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: Could not find package.json anywhere in this repository!"
            echo "Files currently in repository:"
            ls -la
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_PATH")
          echo "Found project in: $APP_DIR"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "${{ steps.find-dir.outputs.app_dir }}"
          npm install
          npm run build

      - name: Wrap with Capacitor & build Debug APK
        run: |
          cd "${{ steps.find-dir.outputs.app_dir }}"
          if [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "build" ]; then
            WEB_DIR="build"
          else
            echo "ERROR: Neither dist nor build folder found after npm run build!"
            ls -la
            exit 1
          fi
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "Shahayak" "com.asabusayed.shahayak" --web-dir "$WEB_DIR"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shahayak-apk
          path: app-debug.apk
